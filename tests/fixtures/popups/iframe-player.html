<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0f0a17; color: #fbfbfe; font: 17px -apple-system, system-ui, sans-serif; }
  h1 { color: #a78bfa; font-size: 22px; margin: 0 0 12px; }
  .player { height: 220px; border-radius: 12px; background: #1e0b36; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #c08cf0; cursor: pointer; user-select: none; -webkit-user-select: none; }
  a { color: #a78bfa; font-size: 20px; display: inline-block; padding: 12px 0; }
  p { color: #bfbfc9; }
</style>
<title>Kentik Iframe Player</title>
<style> body { padding: 0; } .player { height: 240px; } </style>
</head>
<body>
  <div class="player" id="player">Плеер в iframe</div>
  <script>
    document.getElementById('player').addEventListener('click', function () {
      window.open('http://127.0.0.1:8765/popups/target.html');
      parent.postMessage('tapped', '*');
    });
  </script>
</body>
</html>
