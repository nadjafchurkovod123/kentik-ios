<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kentik VAST Player 1</title>
<!--
  Плеер 1 (cinemar.cc): перед серией — реклама, как у PlayerJS на kinogo.online: три VAST подряд
  (AdAngle agl008.shop, distribrey.com, adstag0102.xyz) и ролик с cdn.mbt-8.com; контрольный
  запрос на vast-control.kentik.test (его ни один список не знает — если и он не прошёл,
  /etc/hosts не настроен и итог недостоверен). Серия — свой ролик clip.mp4 (без звука).
-->
<style> html, body { margin: 0; height: 100%; background: #000; } video { width: 100%; height: 100%; } </style>
</head>
<body>
<video id="v" playsinline muted autoplay loop></video>
<script>
(function () {
  var port = location.port ? ':' + location.port : '';
  var res = {};
  function report() { parent.postMessage({ kentikVast: 1, player: 'p1', result: res }, '*'); }
  function xhr(key, url) {
    return new Promise(function (resolve) {
      var x = new XMLHttpRequest(), done = false;
      function fin(v) { if (done) return; done = true; res[key] = v; report(); resolve(); }
      x.open('GET', url);
      x.onload = function () { fin(x.status === 200 && /VAST/.test(x.responseText) ? 'OK' : 'S' + x.status); };
      x.onerror = function () { fin('B'); };
      setTimeout(function () { fin('T'); }, 10000);
      x.send();
    });
  }
  function media(key, url) {
    return new Promise(function (resolve) {
      var a = document.createElement('video'), done = false;
      a.muted = true; a.preload = 'auto';
      function fin(v) { if (done) return; done = true; res[key] = v; report(); a.removeAttribute('src'); a.load(); resolve(); }
      a.onloadedmetadata = function () { fin('OK'); };
      a.onerror = function () { fin('B'); };
      setTimeout(function () { fin('T'); }, 12000);
      a.src = url;
    });
  }
  var q = '?cp.host=45d4f7839d324714b7433f91fad2d386|kinogo.biz&cp.domain=kinogo.online';
  Promise.all([
    xhr('a', 'http://cvt-s2.agl008.shop' + port + '/vast/zone.xml' + q),
    xhr('d', 'http://distribrey.com' + port + '/vast/zone.xml?id=64746&roll=pre&dcc=1'),
    xhr('s', 'http://r51.adstag0102.xyz' + port + '/vast/zone.xml?id=190&vast=3&channel1=kinogo.online'),
    media('m', 'http://cdn.mbt-8.com' + port + '/media/clip.mp4'),
    // Контроль без рекламных параметров (на ?cp.host=…&cp.domain= в RU-списке есть своё правило).
    xhr('c', 'http://vast-control.kentik.test' + port + '/vast/zone.xml?id=1')
  ]).then(function () {
    var v = document.getElementById('v'), t0 = Date.now();
    v.src = '/media/clip.mp4';
    v.play().catch(function () {});
    (function check() {
      if (v.currentTime > 0.3) { res.v = 'OK'; report(); return; }
      if (Date.now() - t0 > 15000) { res.v = 'T'; report(); return; }
      setTimeout(check, 300);
    })();
  });
})();
</script>
</body>
</html>
