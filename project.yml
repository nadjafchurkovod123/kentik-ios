# Проект генерируется XcodeGen: `xcodegen generate` создаёт Kentik.xcodeproj (в git не хранится).
name: Kentik

options:
  bundleIdPrefix: io.kentik
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    # Подпись: в симуляторе — локальная ad-hoc («-»), для устройства CI собирает без подписи,
    # подписывает уже AltStore/Sideloadly бесплатным Apple ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Kentik:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
          - "Resources/Filters"
          - "Resources/Filters/**"
      # Списки фильтров (собирает CI) — папкой Filters/ в бандле; локально папки может не быть.
      - path: Sources/Resources/Filters
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Kentik
        PRODUCT_BUNDLE_IDENTIFIER: io.kentik.browser
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  KentikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KentikTests
    dependencies:
      - target: Kentik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kentik.browser.tests
        GENERATE_INFOPLIST_FILE: YES

  KentikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KentikUITests
    dependencies:
      - target: Kentik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kentik.browser.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kentik:
    build:
      targets:
        Kentik: all
        KentikTests: [test]
        KentikUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KentikTests
        - KentikUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
